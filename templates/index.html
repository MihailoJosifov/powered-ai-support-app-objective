<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Support Tickets</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; color: #222; }
    h1 { margin-bottom: 4px; }
    .subtitle { color: #666; margin-top: 0; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e0e0e0; }
    th { color: #555; font-size: 13px; text-transform: uppercase; }
    tr:hover { background: #fafafa; cursor: pointer; }
    input, select, textarea, button { font-size: 14px; padding: 8px; margin-top: 4px; }
    textarea { width: 100%; box-sizing: border-box; }
    form.inline { display: flex; gap: 8px; align-items: center; margin: 16px 0; flex-wrap: wrap; }
    .status { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .status-open { background: #fde2e2; color: #a11; }
    .status-in_progress { background: #fff3cd; color: #8a6d00; }
    .status-resolved { background: #d4edda; color: #1a6d2e; }
    #detail { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
    .msg { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .msg-author { font-weight: bold; }
    .msg-time { color: #999; font-size: 12px; }
    .error { color: #a11; margin: 8px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Support Tickets</h1>
  <p class="subtitle">Create tickets, add messages, and update status &mdash; all backed by Lakebase.</p>

  <form class="inline" id="new-ticket-form">
    <input name="title" id="new-title" placeholder="Ticket title" required style="flex:1">
    <button type="submit">Create Ticket</button>
  </form>

  <form class="inline">
    Filter by status:
    <select id="status-filter">
      <option value="">All</option>
      <option value="open">open</option>
      <option value="in_progress">in_progress</option>
      <option value="resolved">resolved</option>
    </select>
  </form>

  <div id="error" class="error hidden"></div>

  <table>
    <thead>
      <tr><th>ID</th><th>Title</th><th>Status</th><th>Created By</th><th>Created At</th></tr>
    </thead>
    <tbody id="ticket-rows"></tbody>
  </table>

  <div id="detail" class="hidden">
    <h2 id="detail-title"></h2>

    <form class="inline" id="status-form">
      Status:
      <select id="status-select">
        <option value="open">open</option>
        <option value="in_progress">in_progress</option>
        <option value="resolved">resolved</option>
      </select>
      <button type="submit">Update Status</button>
    </form>

    <h3>Messages</h3>
    <div id="messages"></div>

    <form id="message-form">
      <textarea id="message-text" rows="3" placeholder="Add a message..." required></textarea>
      <button type="submit">Add Message</button>
    </form>
  </div>

  <script>
    let currentTicketId = null;

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 5000);
    }

    async function loadTickets() {
      const status = document.getElementById('status-filter').value;
      const url = status ? `/tickets?status=${encodeURIComponent(status)}` : '/tickets';
      const resp = await fetch(url);
      const data = await resp.json();
      if (!resp.ok) { showError(data.error || 'Failed to load tickets'); return; }

      const tbody = document.getElementById('ticket-rows');
      tbody.innerHTML = '';
      data.forEach(t => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${t.ticket_id}</td>
          <td>${escapeHtml(t.title)}</td>
          <td><span class="status status-${t.status}">${t.status}</span></td>
          <td>${escapeHtml(t.created_by)}</td>
          <td>${new Date(t.created_at).toLocaleString()}</td>
        `;
        tr.addEventListener('click', () => openTicket(t.ticket_id));
        tbody.appendChild(tr);
      });
    }

    async function openTicket(ticketId) {
      const resp = await fetch(`/tickets/${ticketId}`);
      const data = await resp.json();
      if (!resp.ok) { showError(data.error || 'Failed to load ticket'); return; }

      currentTicketId = ticketId;
      document.getElementById('detail').classList.remove('hidden');
      document.getElementById('detail-title').textContent = `#${data.ticket.ticket_id} — ${data.ticket.title}`;
      document.getElementById('status-select').value = data.ticket.status;

      const msgDiv = document.getElementById('messages');
      msgDiv.innerHTML = '';
      data.messages.forEach(m => {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `
          <div><span class="msg-author">${escapeHtml(m.author)}</span>
          <span class="msg-time">${new Date(m.created_at).toLocaleString()}</span></div>
          <div>${escapeHtml(m.message_text)}</div>
        `;
        msgDiv.appendChild(div);
      });

      document.getElementById('detail').scrollIntoView({ behavior: 'smooth' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    document.getElementById('new-ticket-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('new-title').value;
      const resp = await fetch('/tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      const data = await resp.json();
      if (!resp.ok) { showError(data.error || 'Failed to create ticket'); return; }
      document.getElementById('new-title').value = '';
      await loadTickets();
    });

    document.getElementById('status-filter').addEventListener('change', loadTickets);

    document.getElementById('status-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status-select').value;
      const resp = await fetch(`/tickets/${currentTicketId}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      const data = await resp.json();
      if (!resp.ok) { showError(data.error || 'Failed to update status'); return; }
      await loadTickets();
      await openTicket(currentTicketId);
    });

    document.getElementById('message-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const message_text = document.getElementById('message-text').value;
      const resp = await fetch(`/tickets/${currentTicketId}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message_text })
      });
      const data = await resp.json();
      if (!resp.ok) { showError(data.error || 'Failed to add message'); return; }
      document.getElementById('message-text').value = '';
      await openTicket(currentTicketId);
    });

    loadTickets();
  </script>
</body>
</html>
